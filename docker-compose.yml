version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: parobharo_postgres
    restart: always
    environment:
      POSTGRES_DB: parobharo_db
      POSTGRES_USER: parobharo_user
      POSTGRES_PASSWORD: parobharo_secure_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
