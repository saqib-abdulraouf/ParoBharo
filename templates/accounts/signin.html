{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | ExamPrep</title>

    <!-- Google Font: Inter (+ JetBrains Mono for label/mono tokens) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Custom design-token stylesheet -->
    <link rel="stylesheet" href="{% static 'css/accounts/signin.css' %}">
</head>

<body>

    <!-- =====================================================================
       Main / Sign In Card
       ===================================================================== -->
    <main class="login-main px-margin-mobile">
        <div class="login-card-wrapper">
            <div class="login-card">

                <div class="text-center mb-4">
                    <h1 class="headline">Welcome Back</h1>
                    <p class="subtitle mb-0">Sign in to continue your preparation journey.</p>
                </div>

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags|default:'danger' }} py-2 px-3 mb-3 text-body-sm" role="alert">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <form id="loginForm" method="POST" action="{% url 'accounts:signin' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ request.GET.next }}">
                    <!-- Email / Username Field -->
                    <div class="js-field-group mb-3">
                        <label class="form-label-token d-block mb-1" for="email">Username or Email Address</label>
                        <input class="form-control-token js-field-input" type="text" id="email" name="email"
                            placeholder="admin or alex@example.com" value="{{ email }}" required>
                    </div>

                    <!-- Password Field -->
                    <div class="js-field-group mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="form-label-token mb-0" for="password">Password</label>
                            <a class="forgot-link" href="{% url 'accounts:forget_password' %}">Forgot Password?</a>
                        </div>
                        <div class="password-field-wrapper">
                            <input class="form-control-token js-field-input pe-5" type="password" id="password"
                                name="password" placeholder="••••••••" autocomplete="current-password" required>
                            <button type="button" class="password-toggle-btn" id="passwordToggle"
                                aria-label="Show password">
                                <i class="bi bi-eye" id="passwordIcon"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Remember Me -->
                    <div class="d-flex align-items-center gap-2 pt-1 mb-4">
                        <input class="remember-check" type="checkbox" id="remember" name="remember">
                        <label class="remember-check-label" for="remember">Remember me for 30 days</label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn-submit" id="submitBtn">
                        <span id="submitBtnText">Sign In</span>
                        <div class="loading-spinner d-none" id="loader"></div>
                    </button>
                </form>

                <!-- Divider -->
                <div class="divider-row">
                    <span>OR CONTINUE WITH</span>
                </div>

                <!-- Social Logins -->
                <div class="row g-3">
                    <div class="col-6">
                        <button type="button" class="social-btn">
                            <i class="bi bi-google"></i>
                            <span>Google</span>
                        </button>
                    </div>
                    <div class="col-6">
                        <button type="button" class="social-btn">
                            <i class="bi bi-microsoft"></i>
                            <span>Microsoft</span>
                        </button>
                    </div>
                </div>

                <p class="signup-text">
                    Don't have an account?
                    <a class="signup-link" href="{% url 'accounts:signup' %}">Sign Up</a>
                </p>

            </div>
        </div>
    </main>


    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="{% static 'js/accounts/signin.js' %}"></script>
</body>

</html>
